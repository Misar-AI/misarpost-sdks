name: misarpost
description: "MisarPost's social publishing API from Dart: schedule and publish posts across every connected channel, generate and repurpose content with AI, research trends and read analytics."
version: 1.0.0
homepage: https://www.misarpost.com
repository: https://github.com/Misar-AI/misarpost-sdks
issue_tracker: https://github.com/Misar-AI/misarpost-sdks/issues
documentation: https://docs.misar.io/post

topics:
  - social-media
  - scheduling
  - content
  - api-client
  - webhooks

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
