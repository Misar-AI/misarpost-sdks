version: 1.0.0
homepage: https://www.misarpost.com
repository: https://github.com/Misar-AI/misarpost-sdks
issue_tracker: https://github.com/Misar-AI/misarpost-sdks/issues
documentation: https://docs.misar.io/post

topics:
  - social-media
  - scheduling
  - content
  - api-client
  - flutter

environment:
