name: Publish Dart SDK

# ONE package, not two. The product ships a single pure-Dart package named
# exactly `misarpost` that works from the Dart CLI, a Dart server AND Flutter,
# on Android, iOS, Linux, macOS and Windows. There is no `misarpost_flutter`,
# no `misar_post`, and no publish-flutter.yml in this repository — the
# discontinued <product>_flutter split is not repeated here.
#
# See publish-typescript.yml for why workflow_call exists: auto-tag.yml cannot
# rely on the tag it pushes to start this workflow, so it calls it directly.
on:
  push:
    tags: ['dart/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being published (optional; pubspec.yaml wins)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being published (optional; pubspec.yaml wins)'
        required: false
        type: string

jobs:
  publish:
    # `dart pub publish` falls back to an interactive OAuth prompt when the
    # credentials file is stale or incomplete, and --force does not suppress
    # it. Without a cap the job sits at that prompt until the 6-hour runner
    # limit, looking indistinguishable from slow work. Observed in a sibling
    # repo: 30+ minutes on `dart pub publish --force`, every prior step green.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require publishing credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "${PUB_CREDENTIALS:-}" ]; then
            echo "::error::Cannot publish the MisarPost Dart SDK to pub.dev: repository secret PUB_CREDENTIALS is not set. It must hold the whole pub-credentials.json produced by \`dart pub login\`."
            exit 1
          fi

      - uses: actions/checkout@v4

      # A pub.dev package name can never be changed or reclaimed once taken, so
      # the one-package rule is enforced here rather than trusted to review.
      # Guarded on the VALUE: awk prints nothing and exits 0 for a missing key.
      - name: Enforce the package name
        run: |
          NAME=$(awk '/^name:/ {print $2; exit}' dart/pubspec.yaml 2>/dev/null | tr -d '[:space:]')
          if [ "$NAME" != "misarpost" ]; then
            echo "::error::dart/pubspec.yaml declares name '${NAME}' — it must be exactly 'misarpost'. One pure-Dart package per product (no _flutter variant, no underscore spelling). pub.dev names are permanent, so this publish is blocked."
            exit 1
          fi

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: dart
      - run: dart analyze
        working-directory: dart
      - run: dart test
        working-directory: dart

      # `dart pub publish` does not read a PUB_CREDENTIALS environment variable —
      # it only ever reads the credentials FILE. Passing the secret as env is
      # silently ignored and the publish then fails on "No credentials". Write
      # the file instead, to both the modern and the legacy location so an SDK
      # bump cannot break it. Nothing is echoed: printf writes straight to disk.
      - name: Install pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart" "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          chmod 600 "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"

      - run: dart pub publish --force
        working-directory: dart
