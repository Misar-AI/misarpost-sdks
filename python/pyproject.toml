[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misarpost"
version = "1.0.0"
description = "MisarPost's social publishing API from Python: schedule and publish posts across every connected channel, generate and repurpose content with AI, research trends, run PersonaForge and read analytics — sync and async, retries, plan-limit upgrade offers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar.AI", email = "hello@misar.io" }]
keywords = ["misarpost", "social-media", "social-media-api", "scheduling", "content-calendar", "ai-content", "repurposing", "hashtags", "trends", "linkedin", "twitter", "instagram", "bluesky", "api-client", "sdk", "async"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://www.misarpost.com"
Documentation = "https://docs.misar.io/post"
Repository = "https://github.com/Misar-AI/misarpost-sdks"
Issues = "https://github.com/Misar-AI/misarpost-sdks/issues"
Changelog = "https://github.com/Misar-AI/misarpost-sdks/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build", "twine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["misarpost"]
